<svg xmlns="http://www.w3.org/2000/svg" width="400" height="280" viewBox="0 0 400 280">
  <rect width="400" height="280" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1"/>
  <text x="200" y="25" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="bold" fill="#333">常用包装材料回收标志</text>

  <!-- 纸 -->
  <g transform="translate(50,50)">
    <text x="50" y="15" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">纸</text>
    <polygon points="50,25 75,40 75,70 50,85 25,70 25,40" fill="none" stroke="#228B22" stroke-width="2"/>
    <text x="50" y="58" text-anchor="middle" font-size="14" font-weight="bold" fill="#228B22">PAP</text>
    <text x="50" y="105" text-anchor="middle" font-size="11" fill="#666">瓦楞纸板/纸箱</text>
  </g>

  <!-- 塑料 -->
  <g transform="translate(160,50)">
    <text x="50" y="15" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">塑料</text>
    <polygon points="50,25 75,40 75,70 50,85 25,70 25,40" fill="none" stroke="#228B22" stroke-width="2"/>
    <text x="50" y="52" text-anchor="middle" font-size="12" font-weight="bold" fill="#228B22">01-07</text>
    <text x="50" y="65" text-anchor="middle" font-size="10" fill="#228B22">PET/HDPE等</text>
    <text x="50" y="105" text-anchor="middle" font-size="11" fill="#666">塑料容器/薄膜</text>
  </g>

  <!-- 铝 -->
  <g transform="translate(270,50)">
    <text x="50" y="15" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">铝</text>
    <polygon points="50,25 75,40 75,70 50,85 25,70 25,40" fill="none" stroke="#228B22" stroke-width="2"/>
    <text x="50" y="58" text-anchor="middle" font-size="14" font-weight="bold" fill="#228B22">ALU</text>
    <text x="50" y="105" text-anchor="middle" font-size="11" fill="#666">铝罐/铝箔</text>
  </g>

  <!-- 铁 -->
  <g transform="translate(50,160)">
    <text x="50" y="15" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">铁</text>
    <polygon points="50,25 75,40 75,70 50,85 25,70 25,40" fill="none" stroke="#228B22" stroke-width="2"/>
    <text x="50" y="58" text-anchor="middle" font-size="14" font-weight="bold" fill="#228B22">FE</text>
    <text x="50" y="105" text-anchor="middle" font-size="11" fill="#666">铁罐/马口铁</text>
  </g>

  <!-- 玻璃 -->
  <g transform="translate(160,160)">
    <text x="50" y="15" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">玻璃</text>
    <polygon points="50,25 75,40 75,70 50,85 25,70 25,40" fill="none" stroke="#228B22" stroke-width="2"/>
    <text x="50" y="58" text-anchor="middle" font-size="14" font-weight="bold" fill="#228B22">GL</text>
    <text x="50" y="105" text-anchor="middle" font-size="11" fill="#666">玻璃瓶/容器</text>
  </g>

  <!-- 复合材料 -->
  <g transform="translate(270,160)">
    <text x="50" y="15" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">复合</text>
    <polygon points="50,25 75,40 75,70 50,85 25,70 25,40" fill="none" stroke="#228B22" stroke-width="2"/>
    <text x="50" y="52" text-anchor="middle" font-size="12" font-weight="bold" fill="#228B22">C/</text>
    <text x="50" y="65" text-anchor="middle" font-size="10" fill="#228B22">80-90</text>
    <text x="50" y="105" text-anchor="middle" font-size="11" fill="#666">利乐包/纸杯</text>
  </g>
</svg>
