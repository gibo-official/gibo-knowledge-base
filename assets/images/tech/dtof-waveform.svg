<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">

    <defs>
        <style>
            .title { font: bold 16px sans-serif; fill: #1a1a2e; }
            .label { font: 12px sans-serif; fill: #333; }
            .val { font: 11px monospace; fill: #555; }
            .arrow { stroke: #20a0a0; stroke-width: 2; marker-end: url(#arrowhead); }
            .dashed { stroke: #888; stroke-width: 1.5; stroke-dasharray: 6 3; }
            .box { fill: #e0f7fa; stroke: #20a0a0; stroke-width: 2; rx: 6; }
            .box2 { fill: #fff3e0; stroke: #e65100; stroke-width: 2; rx: 6; }
            .box3 { fill: #e8f5e9; stroke: #2e7d32; stroke-width: 2; rx: 6; }
            .target { fill: #ffcc80; stroke: #e65100; stroke-width: 2; }
            .dim { stroke: #aaa; stroke-width: 1; }
        </style>
        <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#20a0a0" />
        </marker>
    </defs>

    <text x="400" y="30" class="title" text-anchor="middle">图2：dTOF信号波形 — 发射脉冲与回波时间戳</text>
    <!-- 发射脉冲 -->
    <text x="80" y="70" class="label" fill="#e65100">发射脉冲（Tx）</text>
    <polyline points="80,120 80,120 100,120 100,80 100,120 300,120 300,120" stroke="#e65100" stroke-width="2" fill="none" />
    <text x="100" y="75" class="val" text-anchor="middle">t₀</text>
    <!-- 环境光噪声 -->
    <text x="80" y="200" class="label" fill="#aaa">环境光背景</text>
    <polyline points="80,250 120,245 160,255 200,242 240,258 280,248 320,252 360,245 400,255 440,243 480,257 520,246 560,254 600,242 640,258 680,248 720,252" stroke="#ccc" stroke-width="1" fill="none" />
    <!-- 回波脉冲 -->
    <text x="80" y="320" class="label" fill="#20a0a0">回波脉冲（Rx）</text>
    <polyline points="80,370 80,370 320,370 320,330 330,330 340,330 350,330 360,330 370,330 380,330 390,370 600,370 600,370" stroke="#20a0a0" stroke-width="2" fill="none" />
    <line x1="320" y1="310" x2="320" y2="390" stroke="#e65100" stroke-width="1" stroke-dasharray="4 2" />
    <text x="320" y="305" class="val" text-anchor="middle">t₁</text>
    <line x1="100" y1="310" x2="100" y2="390" stroke="#e65100" stroke-width="1" stroke-dasharray="4 2" />
    <text x="100" y="305" class="val" text-anchor="middle">t₀</text>
    <!-- 时间戳测量 -->
    <rect x="100" y="400" width="220" height="40" class="box" />
    <text x="210" y="425" class="label" text-anchor="middle" fill="#0f4c4c">TDC时间数字转换器</text>
    <line x1="210" y1="370" x2="210" y2="400" stroke="#20a0a0" stroke-width="1" />
    <text x="400" y="425" class="val" text-anchor="middle">Δt = 10ns → d = 1.5m</text>
</svg>