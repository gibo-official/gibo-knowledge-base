<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <style>
      .title { font: bold 16px sans-serif; fill: #1a1a2e; }
      .label { font: 12px sans-serif; fill: #333; }
      .val { font: 11px monospace; fill: #555; }
      .arrow { stroke: #20a0a0; stroke-width: 2; marker-end: url(#arrowhead); }
      .dashed { stroke: #888; stroke-width: 1.5; stroke-dasharray: 6 3; }
      .sensor-box { fill: #e0f7fa; stroke: #20a0a0; stroke-width: 2; rx: 6; }
      .target { fill: #ffcc80; stroke: #e65100; stroke-width: 2; }
      .dim { stroke: #aaa; stroke-width: 1; }
    </style>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#20a0a0" />
    </marker>
  </defs>

  <!-- 标题 -->
  <text x="400" y="30" class="title" text-anchor="middle">图1：三角测距基本原理 — 几何测量模型</text>

  <!-- 发射器 Tx -->
  <rect x="80" y="200" width="60" height="40" class="sensor-box" />
  <text x="110" y="225" class="label" text-anchor="middle" fill="#0f4c4c">Tx 发射</text>

  <!-- 接收器 Rx -->
  <rect x="80" y="280" width="60" height="40" class="sensor-box" />
  <text x="110" y="305" class="label" text-anchor="middle" fill="#0f4c4c">Rx 接收</text>

  <!-- 基线 B -->
  <line x1="110" y1="245" x2="110" y2="275" stroke="#e65100" stroke-width="2" />
  <text x="90" y="263" class="val" fill="#e65100" text-anchor="middle">基线 B</text>

  <!-- 目标（人体） -->
  <ellipse cx="550" cy="240" rx="50" ry="80" class="target" />
  <text x="550" y="245" class="label" text-anchor="middle" fill="#e65100">人体目标</text>

  <!-- 发射光束 -->
  <line x1="140" y1="220" x2="530" y2="230" class="arrow" stroke-dasharray="8 4" />
  <text x="330" y="215" class="val" fill="#20a0a0">发射光束 θ</text>

  <!-- 反射光路径 -->
  <line x1="530" y1="250" x2="140" y2="300" class="arrow" stroke-dasharray="8 4" />
  <text x="350" y="290" class="val" fill="#20a0a0">反射光 → PSD位置 x</text>

  <!-- 距离 D -->
  <line x1="140" y1="380" x2="550" y2="380" class="dashed" />
  <text x="345" y="400" class="label" text-anchor="middle">目标距离 D</text>
  <text x="345" y="418" class="val" text-anchor="middle">D = (B × f) / (x + f × θ)</text>

  <!-- 光斑位置 x 说明 -->
  <line x1="110" y1="320" x2="180" y2="320" stroke="#888" stroke-width="1" />
  <text x="190" y="325" class="val" fill="#888">← 光斑位置 x →</text>

  <!-- 右侧公式框 -->
  <rect x="620" y="100" width="170" height="200" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="8" />
  <text x="705" y="130" class="label" text-anchor="middle" fill="#0f4c4c">核心公式</text>
  <text x="635" y="160" class="val" font-size="11">D = (B × f) / (x + f × θ)</text>
  <text x="635" y="185" class="val" font-size="10" fill="#666">B：基线距离（已知）</text>
  <text x="635" y="205" class="val" font-size="10" fill="#666">f：接收透镜焦距</text>
  <text x="635" y="225" class="val" font-size="10" fill="#666">θ：发射光束夹角</text>
  <text x="635" y="245" class="val" font-size="10" fill="#666">x：PSD光斑位置</text>
  <text x="635" y="270" class="val" font-size="10" fill="#20a0a0">← 待测变量</text>

  <!-- 底部说明 -->
  <rect x="100" y="440" width="600" height="45" fill="#e8f5e9" stroke="#20a0a0" stroke-width="1" rx="6" />
  <text x="110" y="460" class="val" fill="#0f4c4c">核心优势：距离解算依据光斑"位置"而非"亮度"，不受目标颜色/材质影响</text>
  <text x="110" y="478" class="val" fill="#0f4c4c">蹲便隔间场景精准判定人体位置，彻底解决"人走不冲"行业痛点</text>
</svg>
