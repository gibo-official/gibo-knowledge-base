<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
<defs>
  <style>
    .title { font: bold 16px sans-serif; fill: #1a1a2e; }
    .label { font: 12px sans-serif; fill: #333; }
    .val { font: 11px monospace; fill: #555; }
    .box { fill: #e0f7fa; stroke: #20a0a0; stroke-width: 2; rx: 6; }
    .box2 { fill: #fff3e0; stroke: #e65100; stroke-width: 2; rx: 6; }
    .box3 { fill: #e8f5e9; stroke: #2e7d32; stroke-width: 2; rx: 6; }
  </style>
  <marker id="ah" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
    <polygon points="0 0, 8 3, 0 6" fill="#20a0a0" />
  </marker>
</defs>

    <text x="400" y="30" class="title" text-anchor="middle">智能淋浴恒温控温原理 — 冷热混合+PID控制</text>
    <rect x="80" y="140" width="80" height="40" class="box"/><text x="120" y="165" class="label" text-anchor="middle">冷水入口</text>
    <rect x="80" y="220" width="80" height="40" class="box2"/><text x="120" y="245" class="label" text-anchor="middle">热水入口</text>
    <rect x="250" y="150" width="100" height="100" class="box3"/><text x="300" y="180" class="label" text-anchor="middle">比例混合阀</text><text x="300" y="205" class="val" text-anchor="middle">PID控制</text>
    <line x1="160" y1="160" x2="250" y2="190" stroke="#20a0a0" stroke-width="2"/>
    <line x1="160" y1="240" x2="250" y2="220" stroke="#e65100" stroke-width="2"/>
    <rect x="450" y="170" width="100" height="50" class="box"/><text x="500" y="200" class="label" text-anchor="middle">温度传感器</text>
    <line x1="350" y1="220" x2="450" y2="195" stroke="#20a0a0" stroke-width="1"/>
    <rect x="450" y="260" width="100" height="50" class="box3"/><text x="500" y="290" class="label" text-anchor="middle">MCU PID算法</text>
    <line x1="500" y1="220" x2="500" y2="260" stroke="#20a0a0" stroke-width="1"/>
    <rect x="650" y="180" width="80" height="40" class="box2"/><text x="690" y="205" class="label" text-anchor="middle">恒温出水</text>
    <line x1="550" y1="285" x2="350" y2="210" stroke="#c62828" stroke-width="1" stroke-dasharray="4 2"/>
    <text x="450" y="330" class="val" text-anchor="middle">PID：e(t)=T_set-T_actual → 调节混合阀 → 稳定±1℃</text>
    <text x="450" y="360" class="val" text-anchor="middle">控温精度：±1℃ | 响应&lt;3s | 范围：20-50℃</text>
</svg>