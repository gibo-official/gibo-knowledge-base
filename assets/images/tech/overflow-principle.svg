<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
<defs>
  <style>
    .title { font: bold 16px sans-serif; fill: #1a1a2e; }
    .label { font: 12px sans-serif; fill: #333; }
    .val { font: 11px monospace; fill: #555; }
    .box { fill: #e0f7fa; stroke: #20a0a0; stroke-width: 2; rx: 6; }
    .box2 { fill: #fff3e0; stroke: #e65100; stroke-width: 2; rx: 6; }
    .box3 { fill: #e8f5e9; stroke: #2e7d32; stroke-width: 2; rx: 6; }
  </style>
  <marker id="ah" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
    <polygon points="0 0, 8 3, 0 6" fill="#20a0a0" />
  </marker>
</defs>

    <text x="400" y="30" class="title" text-anchor="middle">智能防溢水断电原理 — 水位检测+电磁阀切断</text>
    <rect x="200" y="100" width="200" height="220" fill="#e3f2fd" stroke="#1976d2" stroke-width="2" rx="4"/>
    <text x="300" y="130" class="label" text-anchor="middle" fill="#1976d2">水箱</text>
    <rect x="200" y="260" width="200" height="60" fill="#1976d2" opacity="0.3"/>
    <text x="300" y="295" class="val" text-anchor="middle" fill="#1976d2">水位↑</text>
    <rect x="450" y="180" width="100" height="50" class="box"/><text x="500" y="210" class="label" text-anchor="middle">水位传感器</text>
    <line x1="400" y1="250" x2="450" y2="205" stroke="#20a0a0" stroke-width="2"/>
    <rect x="450" y="270" width="100" height="50" class="box3"/><text x="500" y="300" class="label" text-anchor="middle">MCU判断</text>
    <line x1="500" y1="230" x2="500" y2="270" stroke="#20a0a0" stroke-width="1"/>
    <rect x="200" y="360" width="120" height="50" class="box2"/><text x="260" y="390" class="label" text-anchor="middle">进水电磁阀</text>
    <line x1="500" y1="295" x2="260" y2="375" stroke="#c62828" stroke-width="2"/>
    <text x="380" y="320" class="val" fill="#c62828">关阀指令</text>
    <rect x="500" y="360" width="100" height="50" class="box"/><text x="550" y="390" class="label" text-anchor="middle">声光报警</text>
    <text x="300" y="460" class="val" text-anchor="middle">水位超阈值→关阀→报警 | 响应&lt;100ms | 检测精度±1mm</text>
</svg>