<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
<defs>
  <style>
    .title { font: bold 16px sans-serif; fill: #1a1a2e; }
    .label { font: 12px sans-serif; fill: #333; }
    .val { font: 11px monospace; fill: #555; }
    .box { fill: #e0f7fa; stroke: #20a0a0; stroke-width: 2; rx: 6; }
    .box2 { fill: #fff3e0; stroke: #e65100; stroke-width: 2; rx: 6; }
    .box3 { fill: #e8f5e9; stroke: #2e7d32; stroke-width: 2; rx: 6; }
  </style>
  <marker id="ah" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
    <polygon points="0 0, 8 3, 0 6" fill="#20a0a0" />
  </marker>
</defs>

    <text x="400" y="30" class="title" text-anchor="middle">低功耗多稳态灵动感应 — 方案对比</text>
    <rect x="80" y="80" width="140" height="50" class="box2"/><text x="150" y="112" class="label" text-anchor="middle">传统方案</text>
    <rect x="80" y="150" width="140" height="200" fill="#ffcdd2" stroke="#c62828" rx="6"/>
    <text x="150" y="175" class="val" text-anchor="middle">15mA持续</text>
    <text x="150" y="200" class="val" text-anchor="middle">360mAh/天</text>
    <text x="150" y="225" class="val" text-anchor="middle">干电池</text>
    <text x="150" y="250" class="val" text-anchor="middle">3个月更换</text>
    <text x="150" y="275" class="val" text-anchor="middle">❌</text>
    <rect x="300" y="80" width="160" height="50" class="box3"/><text x="380" y="112" class="label" text-anchor="middle">多稳态灵动方案</text>
    <rect x="300" y="150" width="160" height="200" fill="#c8e6c9" stroke="#2e7d32" rx="6"/>
    <text x="380" y="175" class="val" text-anchor="middle">8μA休眠</text>
    <text x="380" y="200" class="val" text-anchor="middle">0.2mAh/天</text>
    <text x="380" y="225" class="val" text-anchor="middle">干电池</text>
    <text x="380" y="250" class="val" text-anchor="middle">2年不需更换</text>
    <text x="380" y="275" class="val" text-anchor="middle">✅</text>
    <rect x="520" y="80" width="160" height="50" class="box"/><text x="600" y="112" class="label" text-anchor="middle">太阳能辅助方案</text>
    <rect x="520" y="150" width="160" height="200" fill="#e0f7fa" stroke="#20a0a0" rx="6"/>
    <text x="600" y="175" class="val" text-anchor="middle">0μA净功耗</text>
    <text x="600" y="200" class="val" text-anchor="middle">（日间充电）</text>
    <text x="600" y="225" class="val" text-anchor="middle">永久供电</text>
    <text x="600" y="250" class="val" text-anchor="middle">✅✅</text>
    <text x="400" y="420" class="val" text-anchor="middle">仅在有人接近时唤醒工作，无人时μA级休眠 → 电池寿命延长10倍</text>
</svg>