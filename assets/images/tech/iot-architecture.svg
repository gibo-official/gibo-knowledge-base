<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
<defs>
  <style>
    .title { font: bold 16px sans-serif; fill: #1a1a2e; }
    .label { font: 12px sans-serif; fill: #333; }
    .val { font: 11px monospace; fill: #555; }
    .box { fill: #e0f7fa; stroke: #20a0a0; stroke-width: 2; rx: 6; }
    .box2 { fill: #fff3e0; stroke: #e65100; stroke-width: 2; rx: 6; }
    .box3 { fill: #e8f5e9; stroke: #2e7d32; stroke-width: 2; rx: 6; }
  </style>
  <marker id="ah" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
    <polygon points="0 0, 8 3, 0 6" fill="#20a0a0" />
  </marker>
</defs>

    <text x="400" y="30" class="title" text-anchor="middle">IoT物联网接入架构 — 设备+网关+云平台+APP</text>
    <text x="400" y="70" class="label" text-anchor="middle">设备层（感知+控制）</text>
    <rect x="80" y="90" width="100" height="50" class="box"/><text x="130" y="120" class="label" text-anchor="middle">感应水龙头</text>
    <rect x="220" y="90" width="100" height="50" class="box"/><text x="270" y="120" class="label" text-anchor="middle">感应小便器</text>
    <rect x="360" y="90" width="100" height="50" class="box"/><text x="410" y="120" class="label" text-anchor="middle">智能淋浴</text>
    <rect x="500" y="90" width="100" height="50" class="box"/><text x="550" y="120" class="label" text-anchor="middle">干手器</text>
    <rect x="300" y="190" width="200" height="60" class="box3"/>
    <text x="400" y="215" class="label" text-anchor="middle">IoT网关（Wi-Fi/NB-IoT/4G）</text>
    <text x="400" y="240" class="val" text-anchor="middle">协议转换/数据缓存</text>
    <rect x="250" y="300" width="300" height="60" class="box2"/>
    <text x="400" y="325" class="label" text-anchor="middle">云平台（阿里云/腾讯云）</text>
    <text x="400" y="350" class="val" text-anchor="middle">数据存储/分析/远程控制</text>
    <line x1="400" y1="250" x2="400" y2="300" stroke="#20a0a0" stroke-width="2" marker-end="url(#ah)"/>
    <rect x="100" y="420" width="120" height="50" class="box"/><text x="160" y="450" class="label" text-anchor="middle">微信小程序</text>
    <rect x="280" y="420" width="120" height="50" class="box2"/><text x="340" y="450" class="label" text-anchor="middle">Web后台</text>
    <rect x="460" y="420" width="120" height="50" class="box3"/><text x="520" y="450" class="label" text-anchor="middle">APP</text>
    <rect x="640" y="420" width="120" height="50" class="box"/><text x="700" y="450" class="label" text-anchor="middle">BA系统对接</text>
</svg>