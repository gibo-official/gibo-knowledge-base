<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
<defs>
  <style>
    .title { font: bold 16px sans-serif; fill: #1a1a2e; }
    .label { font: 12px sans-serif; fill: #333; }
    .val { font: 11px monospace; fill: #555; }
    .box { fill: #e0f7fa; stroke: #20a0a0; stroke-width: 2; rx: 6; }
    .box2 { fill: #fff3e0; stroke: #e65100; stroke-width: 2; rx: 6; }
    .box3 { fill: #e8f5e9; stroke: #2e7d32; stroke-width: 2; rx: 6; }
  </style>
  <marker id="ah" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
    <polygon points="0 0, 8 3, 0 6" fill="#20a0a0" />
  </marker>
</defs>

    <text x="400" y="30" class="title" text-anchor="middle">恒温控温性能 — 进水温度突变时出水稳定性</text>
    <line x1="80" y1="120" x2="720" y2="120" stroke="#333" stroke-width="2"/>
    <text x="720" y="115" class="val">时间→</text>
    <polyline points="80,180 200,180 200,140 300,140 300,180 500,180 500,130 600,130 600,180" stroke="#e65100" stroke-width="2" fill="none" stroke-dasharray="6 3"/>
    <text x="720" y="135" class="val" fill="#e65100">进水温度</text>
    <polyline points="80,250 200,250 200,280 250,280 300,250 300,270 350,270 500,250 500,275 550,275 600,250" stroke="#c62828" stroke-width="2" fill="none"/>
    <text x="720" y="245" class="val" fill="#c62828">普通（±5℃）</text>
    <polyline points="80,350 200,350 200,345 280,345 300,350 300,348 380,348 500,350 500,347 580,347 600,350" stroke="#2e7d32" stroke-width="2" fill="none"/>
    <text x="720" y="345" class="val" fill="#2e7d32">PID（±1℃）</text>
    <line x1="80" y1="400" x2="80" y2="120" stroke="#333" stroke-width="1"/>
    <text x="70" y="350" class="val" text-anchor="end">35℃</text>
    <rect x="200" y="420" width="400" height="40" class="box3"/>
    <text x="400" y="445" class="label" text-anchor="middle">PID：进水温度突变时3秒内恢复设定温度，波动≤±1℃</text>
</svg>