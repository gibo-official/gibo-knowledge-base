<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
<defs>
  <style>
    .title { font: bold 16px sans-serif; fill: #1a1a2e; }
    .label { font: 12px sans-serif; fill: #333; }
    .val { font: 11px monospace; fill: #555; }
    .box { fill: #e0f7fa; stroke: #20a0a0; stroke-width: 2; rx: 6; }
    .box2 { fill: #fff3e0; stroke: #e65100; stroke-width: 2; rx: 6; }
    .box3 { fill: #e8f5e9; stroke: #2e7d32; stroke-width: 2; rx: 6; }
  </style>
  <marker id="ah" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
    <polygon points="0 0, 8 3, 0 6" fill="#20a0a0" />
  </marker>
</defs>

    <text x="400" y="30" class="title" text-anchor="middle">水锤效应产生原理 — 阀门快速关闭产生压力波</text>
    <line x1="80" y1="200" x2="400" y2="200" stroke="#1976d2" stroke-width="8"/>
    <text x="200" y="190" class="val" fill="#1976d2">进水管道</text>
    <rect x="400" y="160" width="60" height="80" class="box2"/><text x="430" y="205" class="label" text-anchor="middle">电磁阀</text>
    <line x1="460" y1="200" x2="720" y2="200" stroke="#1976d2" stroke-width="8"/>
    <text x="600" y="190" class="val" fill="#1976d2">出水管道</text>
    <path d="M 430,280 L 430,320 L 500,320" stroke="#c62828" stroke-width="2"/><text x="470" y="315" class="val" fill="#c62828">快速关闭</text>
    <path d="M 400,200 L 350,160 L 300,200 L 250,240 L 200,200" stroke="#e65100" stroke-width="2" fill="none"/>
    <text x="300" y="150" class="val" fill="#e65100">压力波 △P</text>
    <rect x="150" y="350" width="200" height="60" fill="#ffcdd2" stroke="#c62828" rx="4"/>
    <text x="250" y="375" class="val" text-anchor="middle">水锤效应</text>
    <text x="250" y="400" class="val" text-anchor="middle">管道震动/噪音/爆管</text>
    <text x="400" y="450" class="val" text-anchor="middle">△P=ρ·c·△v  |  分段关闭→降低△v→压力峰值降低70%</text>
</svg>