<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="Segoe UI, Arial, sans-serif">
  <!-- 背景 -->
  <rect width="900" height="500" fill="#fafbfc" rx="8"/>

  <!-- 标题 -->
  <text x="450" y="35" text-anchor="middle" font-size="18" font-weight="700" fill="#1a1a2e">主动式红外感应控制模块工作原理图</text>
  <text x="450" y="55" text-anchor="middle" font-size="12" fill="#666">Active Infrared Reflective Sensing Architecture</text>

  <!-- 定义渐变 -->
  <defs>
    <linearGradient id="moduleGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#e8f4f4;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#c8e0e0;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="iredGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ff6b6b;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#ee5a5a;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="pdGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4ecdc4;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#3cb5ac;stop-opacity:1"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#555"/>
    </marker>
    <marker id="arrowRed" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#e74c3c"/>
    </marker>
  </defs>

  <!-- 模块外框 -->
  <rect x="50" y="80" width="380" height="340" rx="12" fill="url(#moduleGrad)" stroke="#20a0a0" stroke-width="2"/>
  <text x="240" y="105" text-anchor="middle" font-size="14" font-weight="600" fill="#0f4c4c">红外感应控制模块 (A1 Module)</text>

  <!-- 红外发射管 IRED -->
  <rect x="80" y="140" width="100" height="50" rx="6" fill="url(#iredGrad)" stroke="#c0392b" stroke-width="1.5"/>
  <text x="130" y="162" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">红外发射管</text>
  <text x="130" y="178" text-anchor="middle" font-size="10" fill="#fff">IRED · 940nm</text>

  <!-- 透镜 -->
  <ellipse cx="195" cy="165" rx="15" ry="20" fill="#fff9c4" stroke="#f9a825" stroke-width="1.5" opacity="0.8"/>
  <text x="195" y="200" text-anchor="middle" font-size="9" fill="#666">透镜</text>
  <text x="195" y="212" text-anchor="middle" font-size="8" fill="#999">5°-30°</text>

  <!-- 红外接收管 PD -->
  <rect x="80" y="250" width="100" height="50" rx="6" fill="url(#pdGrad)" stroke="#16a085" stroke-width="1.5"/>
  <text x="130" y="272" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">光电接收管</text>
  <text x="130" y="288" text-anchor="middle" font-size="10" fill="#fff">PD · 带通滤波</text>

  <!-- 透镜2 -->
  <ellipse cx="195" cy="275" rx="15" ry="20" fill="#fff9c4" stroke="#f9a825" stroke-width="1.5" opacity="0.8"/>

  <!-- 信号调理 AGC -->
  <rect x="220" y="250" width="90" height="50" rx="6" fill="#fff3e0" stroke="#e65100" stroke-width="1.5"/>
  <text x="265" y="272" text-anchor="middle" font-size="10" font-weight="600" fill="#e65100">AGC放大</text>
  <text x="265" y="288" text-anchor="middle" font-size="9" fill="#999">滤波·解调</text>

  <!-- MCU -->
  <rect x="330" y="195" width="80" height="80" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
  <text x="370" y="225" text-anchor="middle" font-size="12" font-weight="700" fill="#1565c0">MCU</text>
  <text x="370" y="242" text-anchor="middle" font-size="9" fill="#1565c0">感应算法</text>
  <text x="370" y="256" text-anchor="middle" font-size="9" fill="#1565c0">ADC采样</text>
  <text x="370" y="270" text-anchor="middle" font-size="9" fill="#1565c0">超低功耗</text>

  <!-- 内部连线 -->
  <line x1="180" y1="165" x2="330" y2="210" stroke="#999" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="210" y1="275" x2="220" y2="275" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="310" y1="275" x2="330" y2="255" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="225" y="245" font-size="8" fill="#888">电信号</text>

  <!-- MCU到发射管控制线 -->
  <line x1="350" y1="195" x2="130" y2="190" stroke="#1565c0" stroke-width="1" stroke-dasharray="3,3" opacity="0.5"/>
  <text x="240" y="135" font-size="8" fill="#1565c0" opacity="0.7">PWM驱动 38kHz</text>

  <!-- 人体/手 -->
  <g transform="translate(560, 180)">
    <ellipse cx="0" cy="0" rx="55" ry="70" fill="#fdb" stroke="#e8a87c" stroke-width="2"/>
    <!-- 手指 -->
    <rect x="-15" y="-90" width="10" height="35" rx="5" fill="#fdb" stroke="#e8a87c" stroke-width="1.5"/>
    <rect x="-2" y="-95" width="10" height="40" rx="5" fill="#fdb" stroke="#e8a87c" stroke-width="1.5"/>
    <rect x="11" y="-88" width="10" height="33" rx="5" fill="#fdb" stroke="#e8a87c" stroke-width="1.5"/>
    <text x="0" y="10" text-anchor="middle" font-size="12" font-weight="600" fill="#c0392b">人手</text>
    <text x="0" y="28" text-anchor="middle" font-size="10" fill="#888">Target</text>
    <text x="0" y="48" text-anchor="middle" font-size="9" fill="#aaa">(漫反射体)</text>
  </g>

  <!-- 发射红外光（去） -->
  <path d="M 210 155 Q 380 100 510 160" fill="none" stroke="#e74c3c" stroke-width="2.5" stroke-dasharray="6,4" marker-end="url(#arrowRed)"/>
  <text x="340" y="95" font-size="10" fill="#e74c3c" font-weight="600">① 红外光发射 (38-56kHz调制)</text>

  <!-- 反射红外光（回） -->
  <path d="M 510 220 Q 380 330 210 260" fill="none" stroke="#27ae60" stroke-width="2.5" stroke-dasharray="6,4" marker-end="url(#arrow)"/>
  <text x="330" y="360" font-size="10" fill="#27ae60" font-weight="600">② 红外光反射返回</text>

  <!-- 感应区域标注 -->
  <path d="M 210 145 L 510 150 M 210 280 L 510 250" fill="none" stroke="#20a0a0" stroke-width="1" stroke-dasharray="2,4" opacity="0.4"/>
  <text x="360" y="405" text-anchor="middle" font-size="10" fill="#20a0a0">↔ 感应距离 5-30cm (可调) ↔</text>
  <line x1="210" y1="390" x2="510" y2="390" stroke="#20a0a0" stroke-width="1" opacity="0.5"/>
  <line x1="210" y1="385" x2="210" y2="395" stroke="#20a0a0" stroke-width="1.5"/>
  <line x1="510" y1="385" x2="510" y2="395" stroke="#20a0a0" stroke-width="1.5"/>

  <!-- 电磁阀驱动输出 -->
  <rect x="330" y="320" width="80" height="45" rx="6" fill="#fce4ec" stroke="#c62828" stroke-width="1.5"/>
  <text x="370" y="338" text-anchor="middle" font-size="10" font-weight="600" fill="#c62828">MOSFET</text>
  <text x="370" y="354" text-anchor="middle" font-size="9" fill="#c62828">H桥驱动</text>
  <line x1="370" y1="275" x2="370" y2="320" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 电磁阀/水 -->
  <g transform="translate(560, 330)">
    <rect x="-30" y="-15" width="60" height="40" rx="5" fill="#e8eaf6" stroke="#3f51b5" stroke-width="2"/>
    <text x="0" y="2" text-anchor="middle" font-size="10" font-weight="600" fill="#3f51b5">电磁阀</text>
    <text x="0" y="18" text-anchor="middle" font-size="9" fill="#3f51b5">Valve</text>
    <path d="M 0 25 L 0 45 M -5 40 L 0 45 L 5 40" stroke="#2196f3" stroke-width="2.5" fill="none"/>
    <text x="0" y="62" text-anchor="middle" font-size="10" fill="#2196f3" font-weight="600">💧 出水</text>
  </g>
  <line x1="410" y1="342" x2="530" y2="340" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="455" y="330" font-size="9" fill="#888">③ 脉冲驱动</text>

  <!-- 电源管理 -->
  <rect x="80" y="340" width="100" height="50" rx="6" fill="#f3e5f5" stroke="#7b1fa2" stroke-width="1.5"/>
  <text x="130" y="360" text-anchor="middle" font-size="10" font-weight="600" fill="#7b1fa2">电源管理</text>
  <text x="130" y="376" text-anchor="middle" font-size="9" fill="#7b1fa2">DC 6V/12V/24V</text>
  <line x1="130" y1="340" x2="130" y2="300" stroke="#7b1fa2" stroke-width="1" stroke-dasharray="3,3" opacity="0.5"/>
  <line x1="180" y1="365" x2="330" y2="365" stroke="#7b1fa2" stroke-width="1" stroke-dasharray="3,3" opacity="0.5"/>

  <!-- 底部标注 -->
  <text x="450" y="470" text-anchor="middle" font-size="10" fill="#0f4c4c" font-weight="500">洁博利 GIBO · A1红外感应控制模块 · 940nm主动式红外反射探测架构</text>
  <text x="450" y="487" text-anchor="middle" font-size="9" fill="#999">图1：红外感应控制模块工作原理图</text>
</svg>
