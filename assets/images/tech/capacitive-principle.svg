<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">

    <defs>
        <style>
            .title { font: bold 16px sans-serif; fill: #1a1a2e; }
            .label { font: 12px sans-serif; fill: #333; }
            .val { font: 11px monospace; fill: #555; }
            .arrow { stroke: #20a0a0; stroke-width: 2; marker-end: url(#arrowhead); }
            .dashed { stroke: #888; stroke-width: 1.5; stroke-dasharray: 6 3; }
            .box { fill: #e0f7fa; stroke: #20a0a0; stroke-width: 2; rx: 6; }
            .box2 { fill: #fff3e0; stroke: #e65100; stroke-width: 2; rx: 6; }
            .box3 { fill: #e8f5e9; stroke: #2e7d32; stroke-width: 2; rx: 6; }
            .target { fill: #ffcc80; stroke: #e65100; stroke-width: 2; }
            .dim { stroke: #aaa; stroke-width: 1; }
        </style>
        <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#20a0a0" />
        </marker>
    </defs>

    <text x="400" y="30" class="title" text-anchor="middle">图1：电容触控感应原理 — 手指靠近改变寄生电容</text>
    <!-- 触控面板 -->
    <rect x="200" y="100" width="400" height="250" fill="#f5f5f5" stroke="#333" stroke-width="2" rx="10" />
    <text x="400" y="130" class="label" text-anchor="middle">触控面板（玻璃/亚克力）</text>
    <!-- 感应电极 -->
    <rect x="280" y="160" width="80" height="80" fill="none" stroke="#20a0a0" stroke-width="2" />
    <text x="320" y="207" class="val" text-anchor="middle">电极</text>
    <!-- 手指 -->
    <circle cx="320" cy="100" r="30" fill="#ffcc80" stroke="#e65100" stroke-width="2" />
    <text x="320" y="80" class="label" text-anchor="middle">手指</text>
    <!-- 电场线 -->
    <path d="M 320,130 Q 310,145 305,155" stroke="#20a0a0" stroke-width="1.5" fill="none" marker-end="url(#arrowhead)" />
    <path d="M 320,130 Q 330,145 335,155" stroke="#20a0a0" stroke-width="1.5" fill="none" marker-end="url(#arrowhead)" />
    <!-- 寄生电容 -->
    <text x="150" y="210" class="val" text-anchor="start">Cp</text>
    <path d="M 280,200 Q 240,200 220,180" stroke="#e65100" stroke-width="1.5" fill="none" marker-end="url(#arrowhead)" />
    <text x="160" y="260" class="val" text-anchor="start">手指靠近→Cp ↑</text>
    <path d="M 280,200 Q 240,220 250,250" stroke="#2e7d32" stroke-width="1.5" fill="none" marker-end="url(#arrowhead)" />
    <!-- 等效电路 -->
    <text x="600" y="180" class="label" fill="#1a1a2e">等效电路</text>
    <circle cx="650" cy="220" r="20" fill="none" stroke="#333" stroke-width="2" />
    <text x="650" y="226" class="val" text-anchor="middle">C</text>
    <line x1="650" y1="240" x2="650" y2="280" stroke="#333" stroke-width="2" />
    <line x1="620" y1="280" x2="680" y2="280" stroke="#333" stroke-width="2" />
    <text x="650" y="300" class="val" text-anchor="middle">C = C₀+ΔC</text>
    <!-- 公式 -->
    <rect x="200" y="400" width="400" height="50" class="box2" />
    <text x="400" y="425" class="label" text-anchor="middle" fill="#1a1a2e">ΔC = ε₀·εᵣ·A/d  （电容变化量公式）</text>
    <text x="400" y="445" class="val" text-anchor="middle">感应阈值：0.5pF  |  响应时间：&lt;10ms</text>
</svg>