<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
<defs>
  <style>
    .title { font: bold 16px sans-serif; fill: #1a1a2e; }
    .label { font: 12px sans-serif; fill: #333; }
    .val { font: 11px monospace; fill: #555; }
    .box { fill: #e0f7fa; stroke: #20a0a0; stroke-width: 2; rx: 6; }
    .box2 { fill: #fff3e0; stroke: #e65100; stroke-width: 2; rx: 6; }
    .box3 { fill: #e8f5e9; stroke: #2e7d32; stroke-width: 2; rx: 6; }
  </style>
  <marker id="ah" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
    <polygon points="0 0, 8 3, 0 6" fill="#20a0a0" />
  </marker>
</defs>

    <text x="400" y="30" class="title" text-anchor="middle">半双工单线电路 — 总线仲裁与冲突检测</text>
    <line x1="100" y1="150" x2="700" y2="150" stroke="#e65100" stroke-width="3"/>
    <text x="400" y="140" class="val" text-anchor="middle">单线总线</text>
    <rect x="100" y="220" width="140" height="60" class="box"/><text x="170" y="245" class="label" text-anchor="middle">冲突检测电路</text><text x="170" y="265" class="val" text-anchor="middle">载波侦听</text>
    <rect x="500" y="220" width="140" height="60" class="box2"/><text x="570" y="245" class="label" text-anchor="middle">从机仲裁电路</text><text x="570" y="265" class="val" text-anchor="middle">优先级判定</text>
    <rect x="150" y="340" width="150" height="50" fill="#ffcdd2" stroke="#c62828" rx="4"/><text x="225" y="365" class="val" text-anchor="middle">从机1发送</text>
    <rect x="450" y="340" width="150" height="50" fill="#ffcdd2" stroke="#c62828" rx="4"/><text x="525" y="365" class="val" text-anchor="middle">从机2发送</text>
    <path d="M 300,360 L 350,360 L 350,370 L 370,355 L 350,370 L 350,380 L 300,380" fill="#e65100"/>
    <text x="350" y="355" class="val" text-anchor="middle" fill="#e65100">冲突！</text>
    <rect x="250" y="440" width="300" height="30" class="box3"/><text x="400" y="460" class="val" text-anchor="middle">仲裁：优先级高的从机继续发送，低优先级退让</text>
</svg>