<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
<defs>
  <style>
    .title { font: bold 16px sans-serif; fill: #1a1a2e; }
    .label { font: 12px sans-serif; fill: #333; }
    .val { font: 11px monospace; fill: #555; }
    .box { fill: #e0f7fa; stroke: #20a0a0; stroke-width: 2; rx: 6; }
    .box2 { fill: #fff3e0; stroke: #e65100; stroke-width: 2; rx: 6; }
    .box3 { fill: #e8f5e9; stroke: #2e7d32; stroke-width: 2; rx: 6; }
  </style>
  <marker id="ah" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
    <polygon points="0 0, 8 3, 0 6" fill="#20a0a0" />
  </marker>
</defs>

    <text x="400" y="30" class="title" text-anchor="middle">双模强光免疫抗干扰算法 — 红外+环境光双通道</text>
    <rect x="80" y="120" width="100" height="50" class="box"/><text x="130" y="150" class="label" text-anchor="middle">红外感应通道</text>
    <rect x="80" y="200" width="100" height="50" class="box2"/><text x="130" y="230" class="label" text-anchor="middle">环境光传感器</text>
    <rect x="300" y="140" width="140" height="80" class="box3"/>
    <text x="370" y="165" class="label" text-anchor="middle">双模融合算法</text>
    <text x="370" y="190" class="val" text-anchor="middle">I_ir/(1+k·L)</text>
    <text x="370" y="215" class="val" text-anchor="middle">校正输出</text>
    <line x1="180" y1="145" x2="300" y2="170" stroke="#20a0a0" stroke-width="1"/>
    <line x1="180" y1="225" x2="300" y2="195" stroke="#e65100" stroke-width="1"/>
    <rect x="520" y="140" width="100" height="80" class="box"/><text x="570" y="165" class="label" text-anchor="middle">校正后感应</text><text x="570" y="190" class="val" text-anchor="middle">稳定输出</text><text x="570" y="215" class="val" text-anchor="middle">抗强光</text>
    <line x1="440" y1="180" x2="520" y2="180" stroke="#20a0a0" stroke-width="2" marker-end="url(#ah)"/>
    <rect x="120" y="300" width="560" height="50" class="box3"/>
    <text x="400" y="325" class="label" text-anchor="middle">I_corrected = I_ir / (1 + k·L_ambient)  k=0.01~0.05</text>
    <text x="400" y="360" class="val" text-anchor="middle">100k lux强光：普通算法感应距离↓80% | 双模算法感应距离不变</text>
</svg>