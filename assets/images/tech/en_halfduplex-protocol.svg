<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
<defs>
  <style>
    .title { font: bold 16px sans-serif; fill: #1a1a2e; }
    .label { font: 12px sans-serif; fill: #333; }
    .val { font: 11px monospace; fill: #555; }
    .box { fill: #e0f7fa; stroke: #20a0a0; stroke-width: 2; rx: 6; }
    .box2 { fill: #fff3e0; stroke: #e65100; stroke-width: 2; rx: 6; }
    .box3 { fill: #e8f5e9; stroke: #2e7d32; stroke-width: 2; rx: 6; }
  </style>
  <marker id="ah" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
    <polygon points="0 0, 8 3, 0 6" fill="#20a0a0" />
  </marker>
</defs>

    <text x="400" y="30" class="title" text-anchor="middle">半双工单线通信协议 — 时隙分配</text>
    <rect x="80" y="140" width="100" height="60" class="box"/><text x="130" y="175" class="label" text-anchor="middle">主机（主控）</text>
    <rect x="680" y="90" width="100" height="50" class="box2"/><text x="730" y="120" class="label" text-anchor="middle">从机1</text>
    <rect x="680" y="180" width="100" height="50" class="box2"/><text x="730" y="210" class="label" text-anchor="middle">从机2</text>
    <rect x="680" y="270" width="100" height="50" class="box2"/><text x="730" y="300" class="label" text-anchor="middle">从机N</text>
    <line x1="180" y1="170" x2="680" y2="115" stroke="#e65100" stroke-width="3"/>
    <line x1="180" y1="170" x2="680" y2="205" stroke="#e65100" stroke-width="3"/>
    <line x1="180" y1="170" x2="680" y2="295" stroke="#e65100" stroke-width="3"/>
    <text x="400" y="170" class="val" text-anchor="middle" fill="#e65100">单线总线（电源+数据复用）</text>
    <rect x="80" y="360" width="100" height="30" class="box"/><text x="130" y="380" class="val" text-anchor="middle">主机发送</text>
    <rect x="190" y="360" width="60" height="30" class="box3"/><text x="220" y="380" class="val" text-anchor="middle">等待</text>
    <rect x="260" y="360" width="100" height="30" class="box2"/><text x="310" y="380" class="val" text-anchor="middle">从机响应</text>
    <rect x="370" y="360" width="60" height="30" class="box3"/><text x="400" y="380" class="val" text-anchor="middle">等待</text>
    <text x="400" y="440" class="val" text-anchor="middle">节约线材60% | 最大32从机 | 通信距离50m | 载波侦听防冲突</text>
</svg>