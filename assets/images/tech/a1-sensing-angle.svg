<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" font-family="Segoe UI, Arial, sans-serif">
  <rect width="900" height="480" fill="#fafbfc" rx="8"/>
  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1a1a2e">红外感应角度与距离示意图</text>
  <text x="450" y="48" text-anchor="middle" font-size="11" fill="#666">Sensing Angle & Distance Configuration for Different Applications</text>

  <defs>
    <marker id="arr3" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#555"/>
    </marker>
    <radialGradient id="cone1" cx="0%" cy="50%" r="100%">
      <stop offset="0%" style="stop-color:#e74c3c;stop-opacity:0.25"/>
      <stop offset="100%" style="stop-color:#e74c3c;stop-opacity:0.02"/>
    </radialGradient>
    <radialGradient id="cone2" cx="0%" cy="50%" r="100%">
      <stop offset="0%" style="stop-color:#f39c12;stop-opacity:0.25"/>
      <stop offset="100%" style="stop-color:#f39c12;stop-opacity:0.02"/>
    </radialGradient>
    <radialGradient id="cone3" cx="0%" cy="50%" r="100%">
      <stop offset="0%" style="stop-color:#2ecc71;stop-opacity:0.25"/>
      <stop offset="100%" style="stop-color:#2ecc71;stop-opacity:0.02"/>
    </radialGradient>
    <radialGradient id="cone4" cx="0%" cy="50%" r="100%">
      <stop offset="0%" style="stop-color:#3498db;stop-opacity:0.25"/>
      <stop offset="100%" style="stop-color:#3498db;stop-opacity:0.02"/>
    </radialGradient>
  </defs>

  <!-- ===== 场景1: 面盆龙头 8-15cm / 10°-15° ===== -->
  <g transform="translate(0, 0)">
    <text x="210" y="75" text-anchor="middle" font-size="13" font-weight="700" fill="#e74c3c">感应面盆龙头</text>
    <text x="210" y="92" text-anchor="middle" font-size="10" fill="#666">8-15cm · 10°-15°</text>

    <!-- 龙头 -->
    <rect x="150" y="95" width="120" height="12" rx="3" fill="#bdc3c7" stroke="#7f8c8d" stroke-width="1"/>
    <rect x="200" y="107" width="20" height="25" rx="2" fill="#95a5a6" stroke="#7f8c8d" stroke-width="1"/>
    <rect x="190" y="128" width="40" height="8" rx="2" fill="#7f8c8d"/>

    <!-- 感应锥 -->
    <path d="M 210 130 L 295 175 L 295 195 L 210 135 Z" fill="url(#cone1)" stroke="#e74c3c" stroke-width="1.5" stroke-dasharray="4,2"/>
    <path d="M 210 130 L 125 175 L 125 195 L 210 135 Z" fill="url(#cone1)" stroke="#e74c3c" stroke-width="1.5" stroke-dasharray="4,2"/>

    <!-- 手 -->
    <ellipse cx="210" cy="195" rx="30" ry="18" fill="#fdb" stroke="#e8a87c" stroke-width="1.5"/>
    <text x="210" y="200" text-anchor="middle" font-size="9" fill="#c0392b">手</text>

    <!-- 距离标注 -->
    <line x1="245" y1="135" x2="245" y2="190" stroke="#e74c3c" stroke-width="1" marker-start="url(#arr3)" marker-end="url(#arr3)"/>
    <text x="252" y="165" font-size="9" fill="#e74c3c">15cm</text>

    <!-- 出水 -->
    <path d="M 210 136 L 210 170" stroke="#3498db" stroke-width="2" stroke-dasharray="3,2"/>
    <text x="230" y="155" font-size="9" fill="#3498db">💧</text>
  </g>

  <!-- ===== 场景2: 厨房龙头 15-25cm / 15°-20° ===== -->
  <g transform="translate(320, 0)">
    <text x="210" y="75" text-anchor="middle" font-size="13" font-weight="700" fill="#f39c12">感应厨房龙头</text>
    <text x="210" y="92" text-anchor="middle" font-size="10" fill="#666">15-25cm · 15°-20°</text>

    <rect x="150" y="95" width="120" height="12" rx="3" fill="#bdc3c7" stroke="#7f8c8d" stroke-width="1"/>
    <rect x="200" y="107" width="20" height="25" rx="2" fill="#95a5a6" stroke="#7f8c8d" stroke-width="1"/>
    <rect x="190" y="128" width="40" height="8" rx="2" fill="#7f8c8d"/>

    <path d="M 210 130 L 310 185 L 310 205 L 210 135 Z" fill="url(#cone2)" stroke="#f39c12" stroke-width="1.5" stroke-dasharray="4,2"/>
    <path d="M 210 130 L 110 185 L 110 205 L 210 135 Z" fill="url(#cone2)" stroke="#f39c12" stroke-width="1.5" stroke-dasharray="4,2"/>

    <ellipse cx="210" cy="205" rx="35" ry="18" fill="#fdb" stroke="#e8a87c" stroke-width="1.5"/>
    <text x="210" y="210" text-anchor="middle" font-size="9" fill="#c0392b">手/锅</text>

    <line x1="250" y1="135" x2="250" y2="200" stroke="#f39c12" stroke-width="1" marker-start="url(#arr3)" marker-end="url(#arr3)"/>
    <text x="257" y="170" font-size="9" fill="#f39c12">25cm</text>

    <path d="M 210 136 L 210 180" stroke="#3498db" stroke-width="2" stroke-dasharray="3,2"/>
    <text x="230" y="155" font-size="9" fill="#3498db">💧</text>
  </g>

  <!-- ===== 场景3: 小便冲水器 20-30cm / 20°-30° ===== -->
  <g transform="translate(640, 0)">
    <text x="130" y="75" text-anchor="middle" font-size="13" font-weight="700" fill="#2ecc71">小便冲水器</text>
    <text x="130" y="92" text-anchor="middle" font-size="10" fill="#666">20-30cm · 20°-30°</text>

    <!-- 冲水器 -->
    <rect x="90" y="95" width="80" height="40" rx="5" fill="#d5dbdb" stroke="#7f8c8d" stroke-width="1.5"/>
    <circle cx="130" cy="115" r="8" fill="#2ecc71" opacity="0.3" stroke="#27ae60" stroke-width="1.5"/>
    <text x="130" y="119" text-anchor="middle" font-size="7" fill="#27ae60">IR</text>

    <path d="M 130 123 L 200 180 L 200 210 L 130 128 Z" fill="url(#cone3)" stroke="#2ecc71" stroke-width="1.5" stroke-dasharray="4,2"/>
    <path d="M 130 123 L 60 180 L 60 210 L 130 128 Z" fill="url(#cone3)" stroke="#2ecc71" stroke-width="1.5" stroke-dasharray="4,2"/>

    <!-- 人 -->
    <ellipse cx="130" cy="210" rx="25" ry="15" fill="#fdb" stroke="#e8a87c" stroke-width="1.5"/>
    <text x="130" y="215" text-anchor="middle" font-size="9" fill="#27ae60">人</text>

    <line x1="165" y1="128" x2="165" y2="200" stroke="#2ecc71" stroke-width="1" marker-start="url(#arr3)" marker-end="url(#arr3)"/>
    <text x="172" y="165" font-size="9" fill="#2ecc71">30cm</text>
  </g>

  <!-- ===== 场景4: 皂液器 3-8cm / 5°-10° ===== -->
  <g transform="translate(0, 240)">
    <text x="210" y="75" text-anchor="middle" font-size="13" font-weight="700" fill="#3498db">感应皂液器</text>
    <text x="210" y="92" text-anchor="middle" font-size="10" fill="#666">3-8cm · 5°-10°</text>

    <rect x="160" y="95" width="100" height="40" rx="5" fill="#d5dbdb" stroke="#7f8c8d" stroke-width="1.5"/>
    <rect x="200" y="135" width="20" height="10" rx="2" fill="#7f8c8d"/>
    <circle cx="210" cy="115" r="6" fill="#3498db" opacity="0.3" stroke="#2980b9" stroke-width="1.5"/>

    <path d="M 210 132 L 245 160 L 245 170 L 210 135 Z" fill="url(#cone4)" stroke="#3498db" stroke-width="1.5" stroke-dasharray="4,2"/>
    <path d="M 210 132 L 175 160 L 175 170 L 210 135 Z" fill="url(#cone4)" stroke="#3498db" stroke-width="1.5" stroke-dasharray="4,2"/>

    <ellipse cx="210" cy="170" rx="20" ry="12" fill="#fdb" stroke="#e8a87c" stroke-width="1.5"/>
    <text x="210" y="174" text-anchor="middle" font-size="9" fill="#2980b9">手</text>

    <line x1="235" y1="135" x2="235" y2="165" stroke="#3498db" stroke-width="1" marker-start="url(#arr3)" marker-end="url(#arr3)"/>
    <text x="242" y="152" font-size="9" fill="#3498db">8cm</text>

    <text x="210" y="195" text-anchor="middle" font-size="9" fill="#3498db">🧴</text>
  </g>

  <!-- ===== 场景5: 蹲便冲水器 20-30cm / 25°-30° ===== -->
  <g transform="translate(320, 240)">
    <text x="210" y="75" text-anchor="middle" font-size="13" font-weight="700" fill="#9b59b6">蹲便冲水器</text>
    <text x="210" y="92" text-anchor="middle" font-size="10" fill="#666">20-30cm · 25°-30°</text>

    <rect x="150" y="95" width="120" height="12" rx="3" fill="#bdc3c7" stroke="#7f8c8d" stroke-width="1"/>
    <rect x="195" y="107" width="30" height="25" rx="3" fill="#95a5a6" stroke="#7f8c8d" stroke-width="1"/>
    <circle cx="210" cy="120" r="7" fill="#9b59b6" opacity="0.3" stroke="#8e44ad" stroke-width="1.5"/>

    <path d="M 210 127 L 305 185 L 305 215 L 210 132 Z" fill="none" stroke="#9b59b6" stroke-width="1.5" stroke-dasharray="4,2" opacity="0.5"/>
    <path d="M 210 127 L 115 185 L 115 215 L 210 132 Z" fill="none" stroke="#9b59b6" stroke-width="1.5" stroke-dasharray="4,2" opacity="0.5"/>

    <ellipse cx="210" cy="210" rx="40" ry="15" fill="#fdb" stroke="#e8a87c" stroke-width="1.5"/>
    <text x="210" y="215" text-anchor="middle" font-size="9" fill="#8e44ad">人体</text>

    <line x1="255" y1="132" x2="255" y2="200" stroke="#9b59b6" stroke-width="1" marker-start="url(#arr3)" marker-end="url(#arr3)"/>
    <text x="262" y="170" font-size="9" fill="#9b59b6">30cm</text>
  </g>

  <!-- 参数总表 -->
  <g transform="translate(640, 240)">
    <rect x="50" y="70" width="200" height="150" rx="8" fill="#fff" stroke="#ddd" stroke-width="1.5"/>
    <text x="150" y="90" text-anchor="middle" font-size="11" font-weight="700" fill="#333">感应参数对照表</text>
    <line x1="60" y1="98" x2="240" y2="98" stroke="#eee"/>

    <text x="60" y="115" font-size="9" fill="#e74c3c" font-weight="600">面盆龙头</text>
    <text x="240" y="115" text-anchor="end" font-size="9" fill="#666">8-15cm / 10-15°</text>

    <text x="60" y="132" font-size="9" fill="#f39c12" font-weight="600">厨房龙头</text>
    <text x="240" y="132" text-anchor="end" font-size="9" fill="#666">15-25cm / 15-20°</text>

    <text x="60" y="149" font-size="9" fill="#2ecc71" font-weight="600">小便冲水</text>
    <text x="240" y="149" text-anchor="end" font-size="9" fill="#666">20-30cm / 20-30°</text>

    <text x="60" y="166" font-size="9" fill="#9b59b6" font-weight="600">蹲便冲水</text>
    <text x="240" y="166" text-anchor="end" font-size="9" fill="#666">20-30cm / 25-30°</text>

    <text x="60" y="183" font-size="9" fill="#3498db" font-weight="600">皂液器</text>
    <text x="240" y="183" text-anchor="end" font-size="9" fill="#666">3-8cm / 5-10°</text>

    <line x1="60" y1="195" x2="240" y2="195" stroke="#eee"/>
    <text x="150" y="210" text-anchor="middle" font-size="8" fill="#999">距离/角度均可通过电位器或软件调节</text>
  </g>

  <text x="450" y="465" text-anchor="middle" font-size="9" fill="#999">图7：红外感应角度与距离示意图 — 不同应用场景的感应距离和角度配置</text>
</svg>
