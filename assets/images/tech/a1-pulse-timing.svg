<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" font-family="Segoe UI, Arial, sans-serif">
  <rect width="900" height="360" fill="#fafbfc" rx="8"/>
  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1a1a2e">红外发射载波调制波形图</text>
  <text x="450" y="48" text-anchor="middle" font-size="11" fill="#666">38kHz Carrier with Pulse Modulation — IR Emission Timing</text>

  <defs>
    <marker id="arr2" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#666"/>
    </marker>
  </defs>

  <!-- 坐标轴 -->
  <line x1="80" y1="300" x2="840" y2="300" stroke="#333" stroke-width="2"/>
  <line x1="80" y1="300" x2="80" y2="70" stroke="#333" stroke-width="2"/>
  <text x="50" y="75" font-size="10" fill="#333">幅度</text>
  <text x="845" y="305" font-size="10" fill="#333">时间</text>
  <text x="70" y="315" font-size="9" fill="#999">0</text>

  <!-- ===== 波形1：38kHz载波（局部放大）===== -->
  <text x="100" y="90" font-size="12" font-weight="600" fill="#e74c3c">① 38kHz 红外载波信号（局部放大）</text>

  <!-- 载波方波 -->
  <path d="M 100 280 L 100 230 L 112 230 L 112 280 L 124 280 L 124 230 L 136 230 L 136 280 L 148 280 L 148 230 L 160 230 L 160 280 L 172 280 L 172 230 L 184 230 L 184 280 L 196 280 L 196 230 L 208 230 L 208 280 L 220 280 L 220 230 L 232 230 L 232 280"
        fill="none" stroke="#e74c3c" stroke-width="2"/>

  <!-- 标注 -->
  <line x1="100" y1="225" x2="100" y2="280" stroke="#e74c3c" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="124" y1="225" x2="124" y2="280" stroke="#e74c3c" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="100" y1="215" x2="124" y2="215" stroke="#e74c3c" stroke-width="1" marker-end="url(#arr2)" marker-start="url(#arr2)"/>
  <text x="112" y="207" text-anchor="middle" font-size="9" fill="#e74c3c">T=26.3μs</text>
  <text x="112" y="195" text-anchor="middle" font-size="8" fill="#999">(38kHz)</text>

  <!-- ===== 波形2：脉冲调制信号 ===== -->
  <text x="300" y="90" font-size="12" font-weight="600" fill="#1565c0">② 脉冲调制信号（完整周期）</text>

  <!-- 脉冲组1 -->
  <g>
    <!-- 脉冲串1 -->
    <rect x="300" y="250" width="80" height="3" fill="#1565c0"/>
    <text x="280" y="255" font-size="8" fill="#1565c0" text-anchor="end">ON</text>
    <rect x="300" y="270" width="80" height="3" fill="#1565c0"/>
    <text x="280" y="275" font-size="8" fill="#1565c0" text-anchor="end">OFF</text>

    <!-- 细节放大标注 -->
    <rect x="300" y="240" width="20" height="20" fill="none" stroke="#e74c3c" stroke-width="1" stroke-dasharray="2,2"/>
    <line x1="320" y1="240" x2="320" y2="120" stroke="#e74c3c" stroke-width="1" stroke-dasharray="2,2"/>
    <line x1="320" y1="120" x2="390" y2="120" stroke="#e74c3c" stroke-width="1"/>
    <text x="395" y="125" font-size="9" fill="#e74c3c">← 左侧详图</text>

    <!-- 间隙 -->
    <line x1="380" y1="255" x2="460" y2="255" stroke="#ccc" stroke-width="1" stroke-dasharray="3,3"/>

    <!-- 脉冲串2 -->
    <rect x="460" y="250" width="80" height="3" fill="#1565c0"/>
    <line x1="540" y1="255" x2="620" y2="255" stroke="#ccc" stroke-width="1" stroke-dasharray="3,3"/>

    <!-- 脉冲串3 -->
    <rect x="620" y="250" width="80" height="3" fill="#1565c0"/>
    <line x1="700" y1="255" x2="780" y2="255" stroke="#ccc" stroke-width="1" stroke-dasharray="3,3"/>
  </g>

  <!-- 脉冲间隔标注 -->
  <line x1="380" y1="230" x2="460" y2="230" stroke="#666" stroke-width="1" marker-end="url(#arr2)" marker-start="url(#arr2)"/>
  <text x="420" y="222" text-anchor="middle" font-size="9" fill="#666">间隙 ~20ms</text>

  <!-- 脉冲串标注 -->
  <text x="340" y="235" text-anchor="middle" font-size="8" fill="#1565c0">脉冲串1</text>
  <text x="500" y="235" text-anchor="middle" font-size="8" fill="#1565c0">脉冲串2</text>
  <text x="660" y="235" text-anchor="middle" font-size="8" fill="#1565c0">脉冲串3</text>

  <!-- ===== 波形3：接收端解调信号 ===== -->
  <text x="100" y="130" font-size="12" font-weight="600" fill="#2e7d32">③ 接收端解调输出信号</text>

  <!-- 基线 -->
  <line x1="100" y1="180" x2="780" y2="180" stroke="#aaa" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- 解调脉冲 -->
  <path d="M 100 180 L 100 145 L 180 145 L 180 180 L 460 180 L 460 145 L 540 145 L 540 180 L 620 180 L 620 145 L 700 145 L 700 180"
        fill="none" stroke="#2e7d32" stroke-width="2"/>

  <!-- 阈值线 -->
  <line x1="100" y1="155" x2="780" y2="155" stroke="#f57f17" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="790" y="158" font-size="9" fill="#f57f17">触发阈值</text>

  <!-- 有效触发标注 -->
  <rect x="95" y="140" width="90" height="15" fill="#2e7d32" opacity="0.1" rx="2"/>
  <text x="140" y="138" text-anchor="middle" font-size="9" fill="#2e7d32">有效信号</text>
  <rect x="455" y="140" width="90" height="15" fill="#2e7d32" opacity="0.1" rx="2"/>
  <rect x="615" y="140" width="90" height="15" fill="#2e7d32" opacity="0.1" rx="2"/>

  <!-- 信号强度标注 -->
  <text x="90" y="145" text-anchor="end" font-size="8" fill="#2e7d32">HIGH</text>
  <text x="90" y="185" text-anchor="end" font-size="8" fill="#aaa">LOW</text>

  <!-- 底部说明 -->
  <line x1="80" y1="310" x2="840" y2="310" stroke="#ddd" stroke-width="1"/>
  <text x="100" y="330" font-size="10" fill="#555">说明：MCU以38kHz频率驱动IRED发射红外光，采用脉冲串+间隙模式降低功耗。</text>
  <text x="100" y="346" font-size="10" fill="#555">接收端PD检测反射信号并解调，当解调信号超过动态阈值时判定为有效触发。</text>
  <text x="100" y="356" font-size="9" fill="#999">图3：红外发射载波调制波形 — 38kHz载波与脉冲调制信号</text>
</svg>
