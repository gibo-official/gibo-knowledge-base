<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
<defs>
  <style>
    .title { font: bold 16px sans-serif; fill: #1a1a2e; }
    .label { font: 12px sans-serif; fill: #333; }
    .val { font: 11px monospace; fill: #555; }
    .box { fill: #e0f7fa; stroke: #20a0a0; stroke-width: 2; rx: 6; }
    .box2 { fill: #fff3e0; stroke: #e65100; stroke-width: 2; rx: 6; }
    .box3 { fill: #e8f5e9; stroke: #2e7d32; stroke-width: 2; rx: 6; }
  </style>
  <marker id="ah" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
    <polygon points="0 0, 8 3, 0 6" fill="#20a0a0" />
  </marker>
</defs>

    <text x="400" y="30" class="title" text-anchor="middle">单窗双模手势辨识原理 — 反射光强度分布分析</text>
    <rect x="80" y="140" width="70" height="40" class="box"/><text x="115" y="165" class="label" text-anchor="middle">红外发射</text>
    <rect x="350" y="140" width="70" height="40" class="box2"/><text x="385" y="165" class="label" text-anchor="middle">单窗接收</text>
    <circle cx="210" cy="100" r="12" fill="#ffcc80" stroke="#e65100" stroke-width="2"/>
    <text x="210" y="80" class="label" fill="#e65100">手势：手挥过</text>
    <path d="M 200,120 L 260,120 L 260,110 L 280,125 L 260,140 L 260,130 L 320,130" stroke="#e65100" stroke-width="2" fill="none"/>
    <rect x="150" y="220" width="240" height="60" fill="#e0f7fa" stroke="#20a0a0" rx="4"/>
    <polyline points="155,270 200,260 250,230 300,240 345,270" stroke="#e65100" stroke-width="2" fill="none"/>
    <text x="270" y="220" class="val">反射光强度分布（左强右弱→左挥）</text>
    <rect x="520" y="130" width="140" height="120" class="box3"/>
    <text x="590" y="155" class="label" text-anchor="middle">双模分析</text>
    <text x="590" y="180" class="val" text-anchor="middle">模式A：强度分布</text>
    <text x="590" y="205" class="val" text-anchor="middle">模式B：时序变化</text>
    <text x="590" y="235" class="val" text-anchor="middle">→方向判定</text>
    <line x1="420" y1="160" x2="520" y2="165" stroke="#20a0a0" stroke-width="1"/>
    <text x="400" y="360" class="val" text-anchor="middle">单窗设计：仅需1个接收窗口，通过双模算法实现方向辨识，降低成本30%</text>
    <text x="400" y="390" class="val" text-anchor="middle">识别准确率&gt;95% | 响应时间&lt;50ms</text>
