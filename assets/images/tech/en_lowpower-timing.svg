<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
<defs>
  <style>
    .title { font: bold 16px sans-serif; fill: #1a1a2e; }
    .label { font: 12px sans-serif; fill: #333; }
    .val { font: 11px monospace; fill: #555; }
    .box { fill: #e0f7fa; stroke: #20a0a0; stroke-width: 2; rx: 6; }
    .box2 { fill: #fff3e0; stroke: #e65100; stroke-width: 2; rx: 6; }
    .box3 { fill: #e8f5e9; stroke: #2e7d32; stroke-width: 2; rx: 6; }
  </style>
  <marker id="ah" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
    <polygon points="0 0, 8 3, 0 6" fill="#20a0a0" />
  </marker>
</defs>

    <text x="400" y="30" class="title" text-anchor="middle">低功耗多稳态灵动感应 — 休眠/唤醒时序图</text>
    <rect x="80" y="80" width="180" height="40" class="box3" /><text x="170" y="105" class="val" text-anchor="middle">休眠 50s（&lt;10μA）</text>
    <rect x="280" y="80" width="100" height="40" class="box2" /><text x="330" y="105" class="val" text-anchor="middle">唤醒 100ms</text>
    <rect x="400" y="80" width="120" height="40" class="box" /><text x="460" y="105" class="val" text-anchor="middle">感应 200ms</text>
    <rect x="540" y="80" width="140" height="40" class="box3" /><text x="610" y="105" class="val" text-anchor="middle">触发→持续输出</text>
    <text x="400" y="170" class="label" text-anchor="middle">工作电流对比</text>
    <polyline points="80,230 280,230 280,210 360,210 360,230 460,230" stroke="#e65100" stroke-width="2" fill="none"/>
    <text x="300" y="205" class="val" fill="#e65100">唤醒 200μA</text>
    <polyline points="80,300 280,300 280,280 360,280 360,300 560,300" stroke="#20a0a0" stroke-width="2" fill="none"/>
    <text x="300" y="275" class="val" fill="#20a0a0">休眠 8μA</text>
    <text x="400" y="380" class="val" text-anchor="middle">传统：15mA×24h=360mAh/天  |  多稳态：0.2mAh/天  →  节能99.9%</text>
    <text x="400" y="410" class="val" text-anchor="middle">适用：电池供电感应洁具，干电池2年不需更换</text>
</svg>