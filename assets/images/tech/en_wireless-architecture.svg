<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="800" height="520">

    <defs>
        <style>
            .title { font: bold 16px sans-serif; fill: #1a1a2e; }
            .label { font: 12px sans-serif; fill: #333; }
            .val { font: 11px monospace; fill: #555; }
            .arrow { stroke: #20a0a0; stroke-width: 2; marker-end: url(#arrowhead); }
            .dashed { stroke: #888; stroke-width: 1.5; stroke-dasharray: 6 3; }
            .box { fill: #e0f7fa; stroke: #20a0a0; stroke-width: 2; rx: 6; }
            .box2 { fill: #fff3e0; stroke: #e65100; stroke-width: 2; rx: 6; }
            .box3 { fill: #e8f5e9; stroke: #2e7d32; stroke-width: 2; rx: 6; }
            .target { fill: #ffcc80; stroke: #e65100; stroke-width: 2; }
            .dim { stroke: #aaa; stroke-width: 1; }
        </style>
        <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#20a0a0" />
        </marker>
    </defs>

    <text x="400" y="30" class="title" text-anchor="middle">图2：无线遥控硬件架构 — 射频模块+MCU+电源</text>
    <!-- 射频模块 -->
    <rect x="80" y="120" width="100" height="60" class="box" />
    <text x="130" y="155" class="label" text-anchor="middle" fill="#0f4c4c">射频模块</text>
    <text x="130" y="172" class="val" text-anchor="middle">433/868MHz</text>
    <!-- MCU -->
    <rect x="240" y="120" width="100" height="60" class="box3" />
    <text x="290" y="155" class="label" text-anchor="middle" fill="#1a1a2e">MCU</text>
    <line x1="180" y1="150" x2="240" y2="150" stroke="#20a0a0" stroke-width="2" marker-end="url(#arrowhead)" />
    <text x="210" y="140" class="val" text-anchor="middle">UART/SPI</text>
    <!-- 电源 -->
    <rect x="240" y="220" width="100" height="50" class="box2" />
    <text x="290" y="250" class="label" text-anchor="middle" fill="#1a1a2e">电源管理</text>
    <line x1="290" y1="180" x2="290" y2="220" stroke="#e65100" stroke-width="1" />
    <!-- 按键 -->
    <rect x="80" y="220" width="100" height="50" class="box2" />
    <text x="130" y="250" class="label" text-anchor="middle" fill="#1a1a2e">按键矩阵</text>
    <line x1="130" y1="180" x2="130" y2="220" stroke="#20a0a0" stroke-width="1" />
    <!-- 指示灯 -->
    <rect x="80" y="310" width="100" height="50" class="box" />
    <text x="130" y="340" class="label" text-anchor="middle" fill="#0f4c4c">LED指示</text>
    <!-- 天线 -->
    <line x1="180" y1="130" x2="180" y2="80" stroke="#333" stroke-width="2" />
    <line x1="170" y1="80" x2="190" y2="80" stroke="#333" stroke-width="2" />
    <text x="180" y="70" class="label" text-anchor="middle">天线</text>
    <!-- 接收端对应 -->
    <rect x="500" y="120" width="100" height="60" class="box" />
    <text x="550" y="155" class="label" text-anchor="middle" fill="#0f4c4c">接收端</text>
    <text x="550" y="172" class="val" text-anchor="middle">同频模块</text>
    <!-- 学习配对 -->
    <rect x="500" y="220" width="100" height="50" class="box3" />
    <text x="550" y="250" class="label" text-anchor="middle" fill="#1a1a2e">ID学习</text>
    <line x1="550" y1="180" x2="550" y2="220" stroke="#20a0a0" stroke-width="1" />
    <path d="M 180,100 L 200,90 L 220,110 L 240,90 L 260,110 L 280,90 L 300,110 L 320,90 L 340,110 L 360,90 L 380,110 L 400,90 L 420,110 L 440,90 L 460,110 L 480,90 L 500,100" stroke="#e65100" stroke-width="1.5" fill="none" marker-end="url(#arrowhead)" />
    <text x="340" y="80" class="val" text-anchor="middle" fill="#e65100">无线信号</text>
    <!-- 加密 -->
    <rect x="500" y="310" width="100" height="50" class="box2" />
    <text x="550" y="340" class="label" text-anchor="middle" fill="#1a1a2e">滚动码加密</text>
    <text x="550" y="430" class="val" text-anchor="middle">通信距离：30m（室内）/ 100m（室外）</text>
    <text x="550" y="450" class="val" text-anchor="middle">加密方式：KEELOQ滚动码 / AES-128</text>
</svg>