<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">

    <defs>
        <style>
            .title { font: bold 16px sans-serif; fill: #1a1a2e; }
            .label { font: 12px sans-serif; fill: #333; }
            .val { font: 11px monospace; fill: #555; }
            .arrow { stroke: #20a0a0; stroke-width: 2; marker-end: url(#arrowhead); }
            .dashed { stroke: #888; stroke-width: 1.5; stroke-dasharray: 6 3; }
            .box { fill: #e0f7fa; stroke: #20a0a0; stroke-width: 2; rx: 6; }
            .box2 { fill: #fff3e0; stroke: #e65100; stroke-width: 2; rx: 6; }
            .box3 { fill: #e8f5e9; stroke: #2e7d32; stroke-width: 2; rx: 6; }
            .target { fill: #ffcc80; stroke: #e65100; stroke-width: 2; }
            .dim { stroke: #aaa; stroke-width: 1; }
        </style>
        <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#20a0a0" />
        </marker>
    </defs>

    <text x="400" y="30" class="title" text-anchor="middle">图1：无线遥控通信协议 — 发射-接收-确认流程</text>
    <!-- 遥控器 -->
    <rect x="80" y="150" width="120" height="80" class="box2" />
    <text x="140" y="167" class="label" text-anchor="middle" fill="#1a1a2e">遥控器</text>
    <text x="140" y="187" class="val" text-anchor="middle">按键按下</text>
    <text x="140" y="207" class="val" text-anchor="middle">编码发射</text>
    <!-- 发射信号 -->
    <path d="M 200,190 L 280,190 L 280,140 L 350,140" stroke="#e65100" stroke-width="2" marker-end="url(#arrowhead)" />
    <text x="270" y="130" class="val" text-anchor="end">射频信号 433/868/915MHz</text>
    <!-- 接收端 -->
    <rect x="350" y="80" width="120" height="50" class="box" />
    <text x="410" y="112" class="label" text-anchor="middle" fill="#0f4c4c">射频接收</text>
    <!-- 解码 -->
    <rect x="350" y="170" width="120" height="50" class="box" />
    <text x="410" y="202" class="label" text-anchor="middle" fill="#0f4c4c">解码校验</text>
    <line x1="410" y1="130" x2="410" y2="170" stroke="#20a0a0" stroke-width="1" />
    <!-- 确认反馈 -->
    <path d="M 470,195 L 530,195 L 530,230 L 610,230" stroke="#2e7d32" stroke-width="2" marker-end="url(#arrowhead)" />
    <text x="540" y="220" class="val" text-anchor="middle" fill="#2e7d32">ACK确认</text>
    <!-- 执行 -->
    <rect x="610" y="200" width="120" height="60" class="box3" />
    <text x="670" y="230" class="label" text-anchor="middle" fill="#1a1a2e">执行动作</text>
    <text x="670" y="250" class="val" text-anchor="middle">开/关/调温</text>
    <!-- 异常重发 -->
    <path d="M 670,260 L 670,300 L 410,300 L 410,170" stroke="#e65100" stroke-width="1.5" stroke-dasharray="6 3" />
    <text x="550" y="290" class="val" text-anchor="middle" fill="#e65100">无ACK→重发（最多3次）</text>
    <!-- 时序 -->
    <text x="400" y="380" class="val" text-anchor="middle">发射(10ms) → 接收解码(5ms) → ACK(5ms) → 执行(10ms)  |  总延迟 &lt; 50ms</text>
    <rect x="120" y="400" width="80" height="30" class="box2" />
    <rect x="220" y="400" width="80" height="30" class="box" />
    <rect x="320" y="400" width="80" height="30" class="box3" />
    <rect x="420" y="400" width="80" height="30" class="box" />
    <text x="160" y="420" class="val" text-anchor="middle">发射</text>
    <text x="260" y="420" class="val" text-anchor="middle">解码</text>
    <text x="360" y="420" class="val" text-anchor="middle">ACK</text>
    <text x="460" y="420" class="val" text-anchor="middle">执行</text>
</svg>